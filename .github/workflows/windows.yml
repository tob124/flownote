name: Windows checks, installer and release
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      npm_config_registry: https://registry.npmjs.org/
      npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: node --test scripts/publish-release.test.mjs
      - run: npm run test:e2e
      - run: npm run package:win
  publish:
    needs: windows
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    env:
      npm_config_registry: https://registry.npmjs.org/
      npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the checked commit for release
        run: |
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          npm ci
          npm run package:win
      - run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
